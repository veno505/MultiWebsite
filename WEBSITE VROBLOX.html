:root{

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',sans-serif;color:var(--text);background:radial-gradient(1200px 700px at 15% -10%,#1a2468 0%,transparent 60%),radial-gradient(900px 600px at 100% 10%,#3a1470 0%,transparent 55%),var(--bg);overflow-x:hidden;transition:filter 1s}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(46,166,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(46,166,255,.05) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;z-index:0;mask-image:radial-gradient(circle at 50% 30%,#000 20%,transparent 80%)}
h1,h2,h3,.orb{font-family:'Orbitron',sans-serif;letter-spacing:.04em}
button{font-family:inherit;cursor:pointer;color:inherit}
.app{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:100vh}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(10px);box-shadow:0 0 24px rgba(46,166,255,.08),inset 0 0 30px rgba(120,80,255,.05)}
header.top{display:flex;align-items:center;gap:14px;padding:12px 16px;flex-wrap:wrap}
.logo{font-size:clamp(14px,2.4vw,22px);font-weight:900;background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px rgba(46,166,255,.4)}
.logo small{display:block;font-size:.55em;color:var(--muted);-webkit-text-fill-color:var(--muted);font-family:'Inter';letter-spacing:.2em}
.hud{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(10,14,40,.7);font-size:13px;font-weight:600;white-space:nowrap}
.chip b{color:var(--cyan)}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;padding:10px 16px}
.bar{font-size:12px;color:var(--muted)}
.bar .t{height:9px;border-radius:9px;background:#111634;border:1px solid var(--line);overflow:hidden;margin-top:4px}
.bar .t i{display:block;height:100%;width:0;border-radius:9px;transition:width .4s;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.bar.en .t i{background:linear-gradient(90deg,#ffb020,var(--green))}
.bar.ap .t i{background:linear-gradient(90deg,var(--purple),var(--pink))}
.bar.sm .t i{background:linear-gradient(90deg,var(--purple),var(--blue))}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px;scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;padding:9px 14px;border-radius:11px;border:1px solid transparent;background:transparent;font-weight:600;font-size:13px;color:var(--muted);transition:.2s}
nav.tabs button:hover{color:var(--text);background:rgba(46,166,255,.1)}
nav.tabs button.on{color:#fff;border-color:var(--blue);background:linear-gradient(135deg,rgba(46,166,255,.25),rgba(161,92,255,.25));box-shadow:0 0 14px rgba(46,166,255,.35)}
main.view{padding:16px;min-height:420px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(8,11,34,.65);transition:.2s}
.card:hover{border-color:var(--cyan);box-shadow:0 0 16px rgba(34,228,255,.18)}
.card h3{font-size:14px;margin-bottom:6px;color:var(--cyan)}
.card p,.muted{font-size:12.5px;color:var(--muted);line-height:1.5}
.btn{padding:8px 13px;border-radius:10px;border:1px solid var(--blue);background:linear-gradient(135deg,rgba(46,166,255,.28),rgba(161,92,255,.28));font-weight:600;font-size:12.5px;transition:.15s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 0 14px rgba(46,166,255,.5)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:linear-gradient(135deg,var(--blue),var(--purple));border-color:transparent;color:#fff}
.btn.dng{border-color:var(--red);background:rgba(255,77,109,.18)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(161,92,255,.2);border:1px solid rgba(161,92,255,.5);color:#d9c2ff}
.tag.g{background:rgba(45,255,154,.14);border-color:rgba(45,255,154,.5);color:var(--green)}
.tag.y{background:rgba(255,216,74,.14);border-color:rgba(255,216,74,.5);color:var(--yellow)}
.tag.r{background:rgba(255,77,109,.14);border-color:rgba(255,77,109,.5);color:var(--red)}
.sec{font-family:'Orbitron';font-size:13px;color:var(--purple);margin:14px 0 8px;letter-spacing:.12em}
.sec:first-child{margin-top:0}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.loc{padding:12px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(18,26,70,.8),rgba(30,12,60,.7));text-align:left;transition:.2s;position:relative;overflow:hidden}
.loc:hover{transform:translateY(-3px);border-color:var(--cyan)}
.loc.here{border-color:var(--green);box-shadow:0 0 18px rgba(45,255,154,.35)}
.loc .ic{font-size:26px}
.loc b{display:block;font-size:13px;margin-top:4px}
.loc span{font-size:11px;color:var(--muted)}
.zone{font-size:10px;letter-spacing:.15em;color:var(--purple);margin-top:6px}
.npc{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:rgba(161,92,255,.1);border:1px dashed rgba(161,92,255,.5);margin-bottom:10px}
.npc .av{font-size:30px}
.mini{height:6px;border-radius:6px;background:#111634;overflow:hidden;margin:6px 0}
.mini i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan))}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--cyan);font-family:'Orbitron';font-size:11px;letter-spacing:.1em}
.log{max-height:150px;overflow:auto;font-size:12.5px;padding:10px 16px;font-family:'JetBrains Mono',monospace;color:#9fb4ff}
.log div{padding:2px 0;border-bottom:1px dotted rgba(80,140,255,.15)}
.modal{position:fixed;inset:0;background:rgba(2,3,12,.8);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal.on{display:flex}
.mbox{width:min(640px,100%);max-height:92vh;overflow:auto;padding:20px;animation:pop .25s}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
pre.code{background:#04050f;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:'JetBrains Mono',monospace;font-size:12.5px;overflow:auto;color:#b8ccff;white-space:pre-wrap}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px;border-radius:10px;border:1px solid var(--line);background:rgba(10,14,40,.8);font-size:13px;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--cyan);background:rgba(34,228,255,.08)}
.opt.ok{border-color:var(--green);background:rgba(45,255,154,.15)}
.opt.bad{border-color:var(--red);background:rgba(255,77,109,.15)}
.nums{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.num{width:54px;height:54px;border-radius:12px;font-family:'Orbitron';font-size:18px;border:1px solid var(--blue);background:rgba(46,166,255,.14)}
.num.done{opacity:.25;pointer-events:none}
.vul{display:block;width:100%;text-align:left;font-family:'JetBrains Mono',monospace;font-size:12px;padding:8px;margin:4px 0;border-radius:8px;border:1px solid var(--line);background:#04050f}
.vul.sel{border-color:var(--yellow);background:rgba(255,216,74,.12)}
.vul.ok{border-color:var(--green)} .vul.bad{border-color:var(--red)}
select,input[type=text]{background:#0a0d26;border:1px solid var(--line);border-radius:9px;padding:8px;color:var(--text);font-family:inherit;font-size:13px;width:100%}
.chat{height:260px;overflow:auto;padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(4,5,15,.7);font-size:13px}
.chat p{margin:3px 0}.chat b{color:var(--cyan)}.chat .me b{color:var(--green)}
#toasts{position:fixed;right:14px;top:14px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 14px;border-radius:12px;background:rgba(12,16,44,.95);border:1px solid var(--cyan);box-shadow:0 0 16px rgba(34,228,255,.4);font-size:13px;animation:pop .25s;max-width:300px}
.toast.bad{border-color:var(--red)}
.preview{border-radius:12px;padding:18px;margin-top:10px;text-align:center;border:1px solid var(--line)}
.event{padding:10px 14px;border-radius:12px;background:linear-gradient(90deg,rgba(255,79,216,.2),rgba(161,92,255,.2));border:1px solid var(--pink);margin-bottom:12px;font-size:13px}
.big{font-size:44px;text-align:center}
@media(max-width:640px){.hud{margin-left:0}.app{padding:8px}main.view{padding:10px}}
</style>
</head>

function initCourses(s){COURSES.forEach(function(c){if(c.sem===s.sem&&!s.courses[c.id])s.courses[c.id]={m:0,att:0,tk:0,aw:-1,uts:null,uas:null};});}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){try{var r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);return true;}}catch(e){}return false;}
function cc(){return COURSES.filter(function(c){return c.sem===S.sem;});}
function studyMul(){var m=1;S.items.forEach(function(id){var it=SHOP.find(function(x){return x.id===id;});if(it&&it.fx==="study")m+=it.v;});return m;}
function itemSum(fx){var m=0;S.items.forEach(function(id){var it=SHOP.find(function(x){return x.id===id;});if(it&&it.fx===fx)m+=it.v;});return m;}
function gpa(){var h=S.hist;if(!h.length)return 0;var t=0;h.forEach(function(x){t+=gp(x.score);});return t/h.length;}
function gp(sc){return sc>=85?4:sc>=78?3.5:sc>=70?3:sc>=62?2.5:sc>=55?2:sc>=45?1:0;}
function grade(sc){return sc>=85?"A":sc>=78?"AB":sc>=70?"B":sc>=62?"BC":sc>=55?"C":sc>=45?"D":"E";}
function log(t){S.log.unshift(t);S.log=S.log.slice(0,40);var l=$("log");if(l)renderLog();}
function toast(t,bad){var d=document.createElement("div");d.className="toast"+(bad?" bad":"");d.textContent=t;$("toasts").appendChild(d);setTimeout(function(){d.remove();},3200);}

/* ================== CORE ACTIONS ================== */
function canAct(ap,en){
  if(S.graduated&&!S.career){toast("Pilih karier dulu!",true);return false;}
  if(S.ap<ap){toast("Waktu minggu ini tidak cukup.",true);return false;}
  if(S.energy<en){toast("Energi tidak cukup. Makan atau tidur dulu!",true);return false;}
  return true;
}
function spend(ap,en){S.ap-=ap;S.energy=clamp(S.energy-en,0,100);}
function afterAct(){
  checkQuests();checkBadges();
  if(S.ap<=0)nextWeek();
  save();render();
}
function addSkill(k,v){
  var g=Math.max(1,Math.round(v*studyMul()));
  if(SKILLS[k]!==undefined)S.skills[k]=clamp(S.skills[k]+g,1,100);
  else if(SOCIAL[k]!==undefined)S.soc[k]=clamp(S.soc[k]+g,1,100);
  return g;
}
function addSoc(k,v){if(SOCIAL[k]!==undefined)S.soc[k]=clamp(S.soc[k]+v,1,100);}
function gain(o){
  var t=[];
  for(var k in o){
    var v=o[k];
    if(k==="money"){S.money+=v;t.push((v>=0?"+":"")+rp(v));}
    else if(k==="energy"){S.energy=clamp(S.energy+v,0,100);t.push((v>=0?"+":"")+v+" energi");}
    else if(k==="rep"){S.rep+=v;t.push((v>=0?"+":"")+v+" reputasi");}
    else if(SKILLS[k]!==undefined){var g=addSkill(k,v);t.push("+"+g+" "+SKILLS[k]);}
    else if(SOCIAL[k]!==undefined){addSoc(k,v);t.push("+"+v+" "+SOCIAL[k]);}
  }
  return t.join(", ");
}
function nextWeek(){
  S.week++;S.ap=10;
  S.energy=clamp(S.energy+20+itemSum("weekEn"),0,100);
  var allow=S.sem<=4?250000:150000;S.money+=allow;
  var cost=120000;S.money-=cost;
  S.orgs.forEach(function(){/* weekly org perk handled in actions */});
  if(S.money<0){S.money=0;S.energy=clamp(S.energy-15,0,100);log("💸 Uang habis! Kamu kelaparan, energi turun.");}
  cc().forEach(function(c){S.courses[c.id].aw=-1;});
  log("📅 Minggu "+S.week+" Semester "+S.sem+". Uang saku "+rp(allow)+", biaya hidup "+rp(cost)+".");
  if(S.week===9){doExam("uts");}
  if(S.week>16){doExam("uas");endSemester();}
}
function examScore(c){
  var d=S.courses[c.id];
  var sc=d.m*0.75+S.skills[c.sk]*0.25+rnd(-6,6)+(S.rep>50?2:0);
  return clamp(Math.round(sc),0,100);
}
function doExam(type){
  var out=[];
  cc().forEach(function(c){var d=S.courses[c.id];d[type]=examScore(c);out.push(c.name+": "+d[type]);});
  log((type==="uts"?"📝 UTS selesai. ":"📝 UAS selesai. ")+out.join(" | "));
  toast((type==="uts"?"UTS":"UAS")+" selesai! Cek tab Kuliah.");
}
function finalScore(c){
  var d=S.courses[c.id];
  var att=d.att/16*100,tk=d.tk/3*100;
  return Math.round(clamp(att*0.1+tk*0.2+(d.uts||0)*0.25+(d.uas||0)*0.45,0,100));
}
function endSemester(){
  var rows=[];
  cc().forEach(function(c){var sc=finalScore(c);S.hist.push({sem:S.sem,id:c.id,name:c.name,score:sc});rows.push("<tr><td>"+esc(c.name)+"</td><td>"+sc+"</td><td><b>"+grade(sc)+"</b></td></tr>");});
  var g=gpa();
  var endedSem=S.sem;
  if(S.sem>=8){
    S.graduated=true;
    showModal("<div class='big'>🎓</div><h2 class='orb' style='text-align:center'>WISUDA!</h2><p class='muted' style='text-align:center;margin:8px 0'>Selamat "+esc(S.name)+", kamu lulus dengan IPK <b style='color:var(--cyan)'>"+g.toFixed(2)+"</b>.<br>Pilih karier di tab Karier.</p><table><tr><th>MK</th><th>Nilai</th><th>Huruf</th></tr>"+rows.join("")+"</table><div class='row'><button class='btn pri' onclick='closeModal();setTab(\"career\")'>Pilih Karier</button></div>");
    S.rep+=30;S.money+=2000000;
  } else {
    S.sem++;S.week=1;S.ap=10;initCourses(S);
    S.money+=500000;
    showModal("<h2 class='orb'>Hasil Semester "+endedSem+"</h2><table><tr><th>MK</th><th>Nilai</th><th>Huruf</th></tr>"+rows.join("")+"</table><p class='muted' style='margin-top:10px'>IPK kumulatif: <b style='color:var(--cyan)'>"+g.toFixed(2)+"</b>. Bonus libur +Rp500.000. Selamat datang di Semester "+S.sem+"!</p><div class='row'><button class='btn pri' onclick='closeModal()'>Lanjut</button></div>");
    S.group=null;
  }
  log("🎓 Semester "+endedSem+" selesai. IPK "+g.toFixed(2)+".");
}

function attend(id){

function doTask(id){

function finishGame(name,ok,tot,rw,ap,en){
  // rw: reward object scaled by accuracy
  var r=tot?ok/tot:0;
  var o={};for(var k in rw){o[k]=Math.max(0,Math.round(rw[k]*r));}
  var t=gain(o);S.stats.games++;S.stats.mg=(S.stats.mg||0)+1;
  if(ok===tot)S.stats.perfect=(S.stats.perfect||0)+1;
  log("🎮 "+name+": "+ok+"/"+tot+" benar. "+t);
  afterAct();
}
function startMini(kind){

}
function runQuiz(title,qs,done,noSpend){
  var i=0,ok=0;
  function show(){
    var q=qs[i];
    var order=q.o.map(function(t,idx){return {t:t,c:idx===q.a};});
    order.sort(function(){return Math.random()-.5;});
    var h="<h3 class='orb'>"+esc(title)+" ("+(i+1)+"/"+qs.length+")</h3><p style='margin:10px 0'>"+esc(q.q)+"</p>";
    if(q.code)h+="<pre class='code'>"+esc(q.code)+"</pre>";
    h+=order.map(function(o,idx){return "<button class='opt' data-i='"+idx+"'>"+esc(o.t)+"</button>";}).join("");
    showModal(h);
    var btns=document.querySelectorAll("#mbox .opt");
    btns.forEach(function(b){b.onclick=function(){
      var o=order[+b.dataset.i];
      btns.forEach(function(x){x.disabled=true;if(order[+x.dataset.i].c)x.classList.add("ok");});
      if(o.c)ok++;else b.classList.add("bad");
      setTimeout(function(){i++;if(i<qs.length)show();else{closeModal();done(ok,qs.length);}},900);
    };});
  }
  show();
}
function miniSort(){
  var arr=[];while(arr.length<6){var v=rnd(1,60);if(arr.indexOf(v)<0)arr.push(v);}
  var sorted=arr.slice().sort(function(a,b){return a-b;});var step=0,err=0;
  function draw(){
    showModal("<h3 class='orb'>Algorithm Puzzle: Sorting</h3><p class='muted'>Klik angka dari yang terkecil ke terbesar.</p><div class='nums'>"+arr.map(function(v,i){return "<button class='num' data-i='"+i+"'>"+v+"</button>";}).join("")+"</div><p id='sinfo' class='muted'>Kesalahan: 0</p>");
    document.querySelectorAll("#mbox .num").forEach(function(b){b.onclick=function(){
      var v=arr[+b.dataset.i];
      if(v===sorted[step]){b.classList.add("done");step++;if(step>=sorted.length){closeModal();runQuiz("Algorithm Puzzle: Logika",pick(QB.alg,2),function(o,t){var tot=t+1;var okAll=o+(err<=1?1:0);finishGame("Algorithm Puzzle",okAll,tot,{ps:6,prog:3,money:80000},0,0);});}}
      else{err++;$("sinfo").textContent="Kesalahan: "+err;}
    };});
  }
  draw();
}

function jobScore(k){return Math.round(JOBS[k].f(S));}
function chooseCareer(k){
  if(S.career)return;
  S.career=k;S.clvl=0;S.cxp=0;log("💼 Kamu menjadi "+JOBS[k].n+"!");toast("Selamat bekerja sebagai "+JOBS[k].n);save();render();
}
function salary(){var j=JOBS[S.career];return Math.round(j.sal*(1+S.clvl*.55)*(0.8+jobScore(S.career)/200));}
function work(){
  var j=JOBS[S.career];
  var chal=j.ch[rnd(0,j.ch.length-1)];
  var qs=[{q:"Tantangan kerja: "+chal+". Bagaimana responsmu?",o:["Analisis masalah, prioritaskan, lalu komunikasikan ke tim","Abaikan sampai ada yang komplain","Salahkan rekan kerja","Matikan notifikasi"],a:0}];
  runQuiz("Bulan Kerja: "+j.n,qs,function(ok){
    S.months++;var sal=salary();
    if(ok){S.money+=sal;S.cxp+=2+Math.round(jobScore(S.career)/40);S.rep+=2;log("💵 Bulan "+S.months+": gaji "+rp(sal)+" dan tantangan berhasil diatasi.");}
    else{S.money+=Math.round(sal*.6);S.cxp+=1;log("💵 Bulan "+S.months+": tantangan gagal, gaji dipotong ("+rp(sal*.6)+").");}
    var need=[0,6,14,26,42];
    if(S.clvl<4&&S.cxp>=need[S.clvl+1]){S.clvl++;toast("Naik jabatan: "+LVLS[S.clvl]+" "+j.n);log("📈 Promosi menjadi "+LVLS[S.clvl]+" "+j.n+"!");}
    S.energy=clamp(S.energy+15,0,100);save();render();
  });
}

  var h="<div class='sec'>MATA KULIAH SEMESTER "+S.sem+"</div><p class='muted'>Hadir di kelas butuh lokasi Gedung Fakultas. Kamu sekarang di "+LOCS[LOC].n+".</p><div class='grid g2' style='margin-top:10px'>";
  cc().forEach(function(c){var d=S.courses[c.id];
   h+="<div class='card'><h3>"+c.name+"</h3><p>👨‍🏫 "+c.dosen+" · Materi: "+c.materi.join(", ")+"</p><div class='mini'><i style='width:"+d.m+"%'></i></div><p>Penguasaan "+d.m+"% · Hadir "+d.att+"/16 · Tugas "+d.tk+"/3</p><p>UTS: "+(d.uts===null?"-":d.uts)+" · UAS: "+(d.uas===null?"-":d.uas)+"</p><div class='row'><button class='btn' onclick='attend(\""+c.id+"\")'>Hadiri Kelas</button><button class='btn' onclick='doTask(\""+c.id+"\")'>Kerjakan Tugas</button><button class='btn' onclick='studyCourse(\""+c.id+"\")'>Belajar</button></div></div>";});
  h+="</div><div class='sec'>RIWAYAT NILAI</div>"+histTable();
  return h;
 },
 skill:function(){
  var h="<div class='sec'>SKILL TEKNOLOGI (1-100)</div><div class='grid g3'>"+Object.keys(SKILLS).map(function(k){return "<div class='card'><h3>"+SKILLS[k]+"</h3><p>Level "+S.skills[k]+"</p><div class='mini'><i style='width:"+S.skills[k]+"%'></i></div></div>";}).join("")+"</div>";
  h+="<div class='sec'>SKILL SOSIAL</div><div class='grid g3'>"+Object.keys(SOCIAL).map(function(k){return "<div class='card'><h3>"+SOCIAL[k]+"</h3><p>Level "+S.soc[k]+"</p><div class='mini'><i style='width:"+S.soc[k]+"%'></i></div></div>";}).join("")+"</div>";
  h+="<div class='sec'>STATUS AKADEMIK</div><div class='card'><p>Kelas dihadiri: "+S.stats.classes+" · Tugas selesai: "+S.stats.tasks+" · IPK: "+gpa().toFixed(2)+"</p></div>";
  return h;
 },
 mini:function(){
  var g=[["dbg","🐞 Debugging Challenge","Cari bug dan pilih perbaikan kode. +Programming",1],["alg","🧮 Algorithm Puzzle","Sorting, searching, logika, flowchart. +Problem Solving",1],["web","🌐 Website Builder","Pilih template, HTML, CSS, JavaScript. +UI/UX",2],["db","🗄️ Database Challenge","Tabel, query, JOIN. +Database",1],["sec","🛡️ Cyber Security Mission","Temukan vulnerability dan lindungi sistem. +Security",1]];
  return "<div class='sec'>MINI GAME PEMROGRAMAN</div><div class='grid g2'>"+g.map(function(x){return "<div class='card'><h3>"+x[1]+"</h3><p>"+x[2]+"</p><div class='row'><span class='tag'>⏱ "+x[3]+"</span><button class='btn pri' onclick='startMini(\""+x[0]+"\")'>Mulai</button></div></div>";}).join("")+"</div>";
 },
 quest:function(){
  var ks=["Akademik","Sosial","Karier"];
  return ks.map(function(k){return "<div class='sec'>QUEST "+k.toUpperCase()+"</div>"+QUESTS.filter(function(q){return q.k===k;}).map(function(q){var d=S.quests[q.id];return "<div class='card' style='margin-bottom:8px'><p>"+(d?"✅":"⬜")+" <b>"+q.t+"</b></p></div>";}).join("");}).join("");
 },
 org:function(){
  var h="<div class='sec'>ORGANISASI & KOMUNITAS</div><div class='grid g2'>"+Object.keys(ORGS).map(function(k){var o=ORGS[k];var j=S.orgs.indexOf(k)>=0;return "<div class='card'><h3>"+o.n+"</h3><p>"+o.desc+"</p><div class='row'>"+(j?"<span class='tag g'>Anggota</span>":"<span class='tag y'>Biaya "+rp(o.cost)+"</span>")+"</div></div>";}).join("")+"</div><p class='muted' style='margin-top:10px'>Gabung & ikut kegiatan di Student Center (tab Peta).</p>";
  return h;
 },
 shop:function(){
  return "<div class='sec'>TOKO TEKNOLOGI & UPGRADE KAMAR</div><div class='grid g3'>"+SHOP.map(function(it){
   var own=S.items.indexOf(it.id)>=0;var lock=it.req&&S.items.indexOf(it.req)<0;
   return "<div class='card'><h3>"+it.n+"</h3><p>"+it.d+"</p><div class='row'><span class='tag y'>"+rp(it.p)+"</span><button class='btn pri' "+((own||lock)?"disabled":"")+" onclick='buy(\""+it.id+"\")'>"+(own?"Dimiliki":lock?"Butuh laptop sebelumnya":"Beli")+"</button></div></div>";}).join("")+"</div>";
 },
 career:function(){
  if(!S.graduated&&!S.career)return "<div class='sec'>KARIER SETELAH LULUS</div><p class='muted'>Lulus semester 8 untuk membuka pilihan karier. Preview:</p><div class='grid g3' style='margin-top:10px'>"+Object.keys(JOBS).map(function(k){var j=JOBS[k];return "<div class='card'><h3>"+j.ic+" "+j.n+"</h3><p>Skill utama: "+j.need+"<br>Gaji awal: "+rp(j.sal)+"<br>Kecocokanmu: "+jobScore(k)+"%</p></div>";}).join("")+"</div>";
  if(!S.career)return "<div class='sec'>PILIH KARIERMU</div><div class='grid g3'>"+Object.keys(JOBS).map(function(k){var j=JOBS[k];return "<div class='card'><h3>"+j.ic+" "+j.n+"</h3><p>Skill utama: "+j.need+"<br>Gaji awal: "+rp(j.sal)+"<br>Kecocokan: <b>"+jobScore(k)+"%</b><br>Tantangan: "+j.ch.join(", ")+"</p><div class='row'><button class='btn pri' onclick='chooseCareer(\""+k+"\")'>Pilih</button></div></div>";}).join("")+"</div>";
  var j=JOBS[S.career];var need=[0,6,14,26,42,999];
  return "<div class='sec'>KARIER ANDA</div><div class='card'><h3>"+j.ic+" "+LVLS[S.clvl]+" "+j.n+"</h3><p>Gaji per bulan: <b>"+rp(salary())+"</b><br>Bulan bekerja: "+S.months+"<br>XP karier: "+S.cxp+(S.clvl<4?" / "+need[S.clvl+1]:" (MAX)")+"</p><div class='row'><button class='btn pri' onclick='work()'>Bekerja 1 Bulan</button></div></div>";
 },
 social:function(){
  var online=BOTS.slice(0,5).map(function(b){return "<span class='tag g'>"+b+" 🟢</span>";}).join(" ");
  return "<div class='sec'>MULTIPLAYER CAMPUS</div><p class='muted'>Online: "+online+" <span class='tag'>Kamu</span></p><p class='muted' style='margin:6px 0'>Chat tersinkron antar tab browser (BroadcastChannel) sehingga bisa dicoba multi-pemain lokal.</p><div class='chat' id='chat'></div><div class='row'><input type='text' id='cin' placeholder='Ketik pesan lalu Enter'><button class='btn pri' id='csend'>Kirim</button></div>";
 },
 rank:function(){
  var me={n:S.name+" (Kamu)",g:gpa(),r:S.rep};
  var bots=[{n:"Kevin",g:3.82,r:90},{n:"Rani",g:3.75,r:70},{n:"Alya",g:3.55,r:60},{n:"Bima",g:3.2,r:55},{n:"Dito",g:2.8,r:35}];
  var all=bots.concat([me]).sort(function(a,b){return b.g-a.g||b.r-a.r;});
  return "<div class='sec'>LEADERBOARD MAHASISWA TERBAIK</div><table><tr><th>#</th><th>Nama</th><th>IPK</th><th>Reputasi</th></tr>"+all.map(function(x,i){return "<tr><td>"+(i+1)+"</td><td>"+esc(x.n)+"</td><td>"+(x.g||0).toFixed(2)+"</td><td>"+x.r+"</td></tr>";}).join("")+"</table><div class='sec'>ACHIEVEMENT BADGE</div><div class='grid g3'>"+BADGES.map(function(b){var h=S.badges.indexOf(b.id)>=0;return "<div class='card' style='opacity:"+(h?1:.4)+"'><h3>"+b.ic+" "+b.n+"</h3><p>"+(h?"Terbuka":"Terkunci")+"</p></div>";}).join("")+"</div>";
 }
};
function histTable(){
  if(!S.hist.length)return "<p class='muted'>Belum ada nilai.</p>";
  return "<table><tr><th>Sem</th><th>Mata Kuliah</th><th>Nilai</th><th>Huruf</th></tr>"+S.hist.map(function(h){return "<tr><td>"+h.sem+"</td><td>"+esc(h.name)+"</td><td>"+h.score+"</td><td>"+grade(h.score)+"</td></tr>";}).join("")+"</table>";
}
function goLoc(k){LOC=k;S.loc=k;log("🚶 Pergi ke "+LOCS[k].n+".");render();save();}
function buy(id){
  var it=SHOP.find(function(x){return x.id===id;});if(!it)return;
  if(S.money<it.p){toast("Uang tidak cukup.",true);return;}
  S.money-=it.p;S.items.push(id);
  if(it.skill)addSkill(it.skill[0],it.skill[1]);
  if(it.fx==="rep")S.rep+=it.v;
  log("🛒 Membeli "+it.n+".");toast("Dibeli: "+it.n);checkBadges();save();render();
}
function manualSleep(){if(S.graduated&&!S.career){toast("Pilih karier dulu!",true);return;}S.ap=0;log("⏭ Minggu dilewati.");afterAct();}
function resetGame(){if(confirm("Hapus semua progres dan mulai ulang?")){localStorage.removeItem(KEY);location.reload();}}
function showModal(h){$("mbox").innerHTML=h;$("modal").classList.add("on");}
function closeModal(){$("modal").classList.remove("on");}

/* ===== chat / multiplayer ===== */
var chatLog=[],bc=null;
try{bc=new BroadcastChannel("informatika_life_chat");bc.onmessage=function(e){addChat(e.data.n,e.data.t,false);};}catch(e){bc=null;}
function addChat(n,t,me){chatLog.push({n:n,t:t,me:me});if(chatLog.length>60)chatLog.shift();var c=$("chat");if(c){drawChat();}}
function drawChat(){var c=$("chat");if(!c)return;c.innerHTML=chatLog.map(function(m){return "<p class='"+(m.me?"me":"")+"'><b>"+esc(m.n)+":</b> "+esc(m.t)+"</p>";}).join("");c.scrollTop=c.scrollHeight;}
function bindChat(){
  drawChat();
  var send=function(){var i=$("cin");var t=i.value.trim();if(!t)return;addChat(S.name,t,true);if(bc)bc.postMessage({n:S.name,t:t});i.value="";};
  $("csend").onclick=send;$("cin").onkeydown=function(e){if(e.key==="Enter")send();};
}
setInterval(function(){addChat(BOTS[rnd(0,BOTS.length-1)],BOTMSG[rnd(0,BOTMSG.length-1)],false);},15000);

/* ================== START ================== */
function intro(){
  showModal("<h2 class='orb' style='text-align:center;background:linear-gradient(90deg,var(--cyan),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent'>INFORMATIKA LIFE</h2><p class='muted' style='text-align:center;margin:6px 0 14px'>CAMPUS SIMULATOR · 4 tahun · 8 semester · satu karier</p><div class='big'>🎓</div><p class='muted' style='margin:10px 0'>Atur waktu antara kuliah, tugas, organisasi, kompetisi, dan keuangan. Raih IPK tinggi, kuasai teknologi, lalu pilih kariermu.</p><input type='text' id='nm' placeholder='Nama mahasiswa' maxlength='20'><div class='row'><button class='btn pri' id='st'>Mulai Kuliah</button></div>");
  $("st").onclick=function(){var n=$("nm").value.trim()||"Mahasiswa Baru";S=newState(n);closeModal();log("🎒 Hari pertama kuliah! Pergi ke Gedung Fakultas untuk hadir di kelas.");LOC="dorm";save();render();};
}
window.addEventListener("load",function(){
  if(load()){LOC=S.loc||"dorm";if(!S.stats.groups)S.stats.groups=0;initCourses(S);render();}
  else{S=newState("");render();intro();}
});
setInterval(function(){if(S)save();},30000);
</script>
